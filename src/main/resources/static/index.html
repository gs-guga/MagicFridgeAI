<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MagicFridge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F3FAF6; --card:#FFFFFF; --ink:#12332A; --muted:#5E7A70; --line:#DCEBE3;
      --green:#14805A; --green-dark:#0E6847; --green-soft:#E3F6EC;
      --orange:#F5A524; --orange-soft:#FFEFD0; --orange-ink:#7A4400;
      --red:#C93725; --red-soft:#FDE6E2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;color:var(--ink);line-height:1.5;
      font-family:"Bricolage Grotesque",system-ui,sans-serif;
      background:linear-gradient(180deg,#DDF3E7 0,var(--bg) 320px) no-repeat,var(--bg);
    }
    .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

    .hero{
      position:relative;overflow:hidden;border-radius:22px;padding:34px 32px;color:#fff;
      background:linear-gradient(135deg,#14805A,#0B5D4A);
    }
    .hero::after{
      content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);
    }
    .hero h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.2rem);line-height:1;font-weight:800;letter-spacing:-.025em}
    .hero p{margin:0;max-width:48ch;font-size:1.05rem;color:#E3F6EC}

    .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;margin-top:26px;align-items:start}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.hero{padding:26px 22px}}

    section{
      background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;
      box-shadow:0 8px 24px -14px rgba(18,51,42,.35);
    }
    h2{font-size:1.3rem;margin:0 0 16px;font-weight:600}

    form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
    .full{grid-column:1/-1}
    label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:600}
    input,select{
      font:inherit;font-weight:400;color:var(--ink);padding:10px 12px;min-width:0;
      border:1.5px solid #CFE3D9;border-radius:10px;background:#fff;
    }
    input:focus,select:focus{border-color:var(--green)}
    input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid rgba(20,128,90,.35);outline-offset:1px}

    button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
    .primary{background:var(--green);color:#fff;box-shadow:0 8px 16px -10px var(--green)}
    .primary:hover{background:var(--green-dark)}
    .primary:disabled{opacity:.65;cursor:wait}
    .ghost{background:transparent;color:var(--muted);padding:6px 8px;font-weight:400;font-size:.85rem}
    .ghost:hover{color:var(--red)}

    ul.itens{list-style:none;margin:0;padding:0}
    .item{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0}
    .emoji{width:44px;height:44px;border-radius:12px;background:var(--green-soft);display:grid;place-items:center;font-size:1.45rem}
    .info{flex:1;min-width:120px}
    .nome{font-weight:600;overflow-wrap:anywhere}
    .cat{font-size:.85rem;color:var(--muted)}
    .qtd{font-weight:800;font-size:.9rem;color:var(--green-dark);background:var(--green-soft);border-radius:8px;padding:2px 9px;white-space:nowrap}
    .chip{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--green-soft);color:var(--green-dark);white-space:nowrap}
    .chip.soon{background:var(--orange-soft);color:var(--orange-ink)}
    .chip.expired{background:var(--red-soft);color:var(--red)}
    .vazio{color:var(--muted);padding:8px 0}
    .aviso{color:var(--red);background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0}

    .acao{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .status{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px}
    .status.erro{color:var(--red)}
    .luz{width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px 3px rgba(245,165,36,.7);animation:pulsa 1.4s ease-in-out infinite}
    @keyframes pulsa{50%{opacity:.35;box-shadow:0 0 4px 1px rgba(245,165,36,.4)}}
    @media(prefers-reduced-motion:reduce){.luz{animation:none}}

    .receita{max-width:68ch}
    .receita h2,.receita h3,.receita h4{margin:1.3em 0 .4em;line-height:1.2;color:var(--green-dark)}
    .receita h2{font-size:1.4rem}.receita h3{font-size:1.2rem}.receita h4{font-size:1.05rem}
    .receita p{margin:.5em 0}
    .receita ul,.receita ol{padding-left:1.3em;margin:.5em 0}
    .receita li{margin:.3em 0}
    .receita hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
    .placeholder{border:2px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
    .placeholder .grande{font-size:2rem;display:block;margin-bottom:6px}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>MagicFridge AI</h1>
    <p>Cadastre o que tem na geladeira e receba uma receita que usa primeiro o que vence antes.</p>
  </header>

  <div class="grid">
    <section aria-labelledby="t-geladeira">
      <h2 id="t-geladeira">Na geladeira</h2>
      <form id="form">
        <label class="full">Item
          <input name="nome" required maxlength="80" placeholder="Ex.: farinha de trigo, leite, tomate">
        </label>
        <label>Quantidade
          <input name="quantidade" type="number" min="1" value="1" required>
        </label>
        <label>Unidade
          <select name="unidade" required>
            <option value="UNIDADE" selected>unidades</option>
            <option value="GRAMAS">gramas (g)</option>
            <option value="MILILITROS">mililitros (ml)</option>
          </select>
        </label>
        <label class="full">Vence em
          <input name="validade" type="date" required>
        </label>
        <p class="cat full">A IA confere se é um alimento e define a categoria.</p>
        <p class="aviso full" id="aviso" role="alert" hidden></p>
        <button class="primary full" type="submit">Adicionar item</button>
      </form>
      <ul class="itens" id="lista"><li class="vazio">Carregando…</li></ul>
    </section>

    <section aria-labelledby="t-receita">
      <h2 id="t-receita">Receita</h2>
      <div class="acao">
        <button class="primary" id="gerar" type="button">Gerar receita</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
      <div class="receita" id="receita">
        <div class="placeholder">
          <span class="grande" aria-hidden="true">🍳</span>
          A receita aparece aqui. Ela usa primeiro os itens que vencem antes.
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const API = '/food-items';
  const ABREV = {UNIDADE: 'un', GRAMAS: 'g', MILILITROS: 'ml'};
  const CATEGORIAS = {
    FRUTAS: 'Frutas',
    LEGUMES_E_VERDURAS: 'Legumes e verduras',
    LATICINIOS: 'Laticínios',
    CARNES: 'Carnes',
    OVOS: 'Ovos',
    GRAOS_E_CEREAIS: 'Grãos e cereais',
    BEBIDAS: 'Bebidas',
    TEMPEROS: 'Temperos',
    OUTROS: 'Outros'
  };
  const EMOJIS = {
    FRUTAS: '🍎', LEGUMES_E_VERDURAS: '🥕', LATICINIOS: '🥛', CARNES: '🥩', OVOS: '🥚',
    GRAOS_E_CEREAIS: '🌾', BEBIDAS: '🥤', TEMPEROS: '🧂', OUTROS: '🍽️'
  };

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // A data pode chegar como "2026-11-10" ou como [2026,11,10], dependendo do Jackson.
  function normData(v){
    if(!v) return '';
    if(Array.isArray(v)){
      const [y,m,d] = v;
      return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    }
    return String(v);
  }

  function diasAte(iso){
    if(!iso) return null;
    const [y,m,d] = iso.split('-').map(Number);
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    return Math.round((new Date(y, m-1, d) - hoje) / 86400000);
  }

  function chip(iso){
    const n = diasAte(iso);
    if(n === null) return '<span class="chip">sem validade</span>';
    const [y,m,d] = iso.split('-');
    const data = d + '/' + m + '/' + y;
    let txt, cls = '';
    if(n < 0){ txt = n === -1 ? 'venceu ontem' : 'venceu há ' + (-n) + ' dias'; cls = 'expired'; }
    else if(n === 0){ txt = 'vence hoje'; cls = 'soon'; }
    else if(n === 1){ txt = 'vence amanhã'; cls = 'soon'; }
    else if(n <= 3){ txt = 'vence em ' + n + ' dias'; cls = 'soon'; }
    else { txt = 'vence em ' + n + ' dias'; }
    return '<span class="chip ' + cls + '" title="' + data + '">' + txt + ' (' + data + ')</span>';
  }

  function renderLista(itens){
    const ul = $('#lista');
    if(!itens.length){
      ul.innerHTML = '<li class="vazio">A geladeira está vazia. Adicione o primeiro item acima.</li>';
      return;
    }
    ul.innerHTML = itens.map(i => {
      const iso = normData(i.validade);
      return '<li class="item">' +
              '<div class="emoji" aria-hidden="true">' + (EMOJIS[i.categoria] || '🍽️') + '</div>' +
              '<div class="info"><div class="nome">' + esc(i.nome) + '</div>' +
              '<div class="cat">' + esc(CATEGORIAS[i.categoria] || 'Sem categoria') + '</div></div>' +
              '<span class="qtd">' + esc(i.quantidade) + ' ' + esc(ABREV[i.unidade] || 'un') + '</span>' +
              chip(iso) +
              '<button class="ghost" data-id="' + esc(i.id) + '" aria-label="Remover ' + esc(i.nome) + '">Remover</button>' +
              '</li>';
    }).join('');
  }

  async function carregar(){
    try{
      const r = await fetch(API);
      if(!r.ok) throw new Error(r.status);
      const itens = await r.json();
      itens.sort((a,b) => (normData(a.validade) || '9999').localeCompare(normData(b.validade) || '9999'));
      renderLista(itens);
    }catch(e){
      $('#lista').innerHTML = '<li class="vazio">Não foi possível carregar os itens. Confira se a aplicação está rodando.</li>';
    }
  }

  function aviso(msg){
    const a = $('#aviso');
    a.textContent = msg || '';
    a.hidden = !msg;
  }

  async function mensagemDeErro(r){
    try{
      const erro = await r.json();
      const campos = erro.campos || (erro.properties && erro.properties.campos);
      if(campos) return Object.values(campos).join(' ');
      if(erro.detail) return erro.detail;
    }catch(e){}
    return 'Não foi possível salvar o item. Tente de novo.';
  }

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    aviso('');
    const f = e.target;
    const botao = f.querySelector('button[type="submit"]');
    botao.disabled = true;
    botao.textContent = 'Verificando…';
    const corpo = {
      nome: f.nome.value.trim(),
      quantidade: Number(f.quantidade.value),
      unidade: f.unidade.value,
      validade: f.validade.value
    };
    try{
      const r = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(corpo)
      });
      if(!r.ok){ aviso(await mensagemDeErro(r)); return; }
      f.reset();
      f.quantidade.value = 1;
      f.nome.focus();
      carregar();
    }catch(err){
      aviso('Não foi possível salvar o item. Confira os campos e tente de novo.');
    }finally{
      botao.disabled = false;
      botao.textContent = 'Adicionar item';
    }
  });

  $('#lista').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-id]');
    if(!btn) return;
    try{
      const r = await fetch(API + '/' + btn.dataset.id, {method: 'DELETE'});
      if(!r.ok) throw new Error(r.status);
      carregar();
    }catch(err){
      aviso('Não foi possível remover o item.');
    }
  });

  // Markdown simples e seguro: o texto é escapado antes de virar HTML.
  function inline(s){
    return esc(s)
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<em>$2</em>');
  }

  function md(txt){
    let html = '', lista = null;
    const fecha = () => { if(lista){ html += '</' + lista + '>'; lista = null; } };
    for(const bruta of txt.replace(/\r/g,'').split('\n')){
      const l = bruta.trim();
      let m;
      if(!l){ fecha(); continue; }
      if(/^-{3,}$/.test(l)){ fecha(); html += '<hr>'; }
      else if((m = l.match(/^(#{1,4})\s+(.*)$/))){
        fecha();
        const n = Math.min(m[1].length + 1, 4);
        html += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>';
      }
      else if((m = l.match(/^[*-]\s+(.*)$/))){
        if(lista !== 'ul'){ fecha(); html += '<ul>'; lista = 'ul'; }
        html += '<li>' + inline(m[1]) + '</li>';
      }
      else if((m = l.match(/^\d+\.\s+(.*)$/))){
        if(lista !== 'ol'){ fecha(); html += '<ol>'; lista = 'ol'; }
        html += '<li>' + inline(m[1]) + '</li>';
      }
      else { fecha(); html += '<p>' + inline(l) + '</p>'; }
    }
    fecha();
    return html;
  }

  $('#gerar').addEventListener('click', async () => {
    const btn = $('#gerar'), st = $('#status'), out = $('#receita');
    btn.disabled = true;
    st.className = 'status';
    st.innerHTML = '<span class="luz"></span>Montando a receita… pode levar até um minuto.';
    try{
      const r = await fetch('/receitas');
      const txt = await r.text();
      if(!r.ok) throw new Error('Erro ' + r.status);
      if(txt.startsWith('Erro ao chamar o Gemini')){
        st.className = 'status erro';
        st.textContent = txt;
      } else {
        st.textContent = '';
        out.innerHTML = md(txt);
      }
    }catch(err){
      st.className = 'status erro';
      st.textContent = 'Não foi possível gerar a receita. O motivo aparece no console da aplicação.';
    }finally{
      btn.disabled = false;
    }
  });

  carregar();
</script>
</body>
</html>

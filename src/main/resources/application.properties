
spring.application.name=MagicFridgeAI
spring.config.import=optional:file:.env[.properties]

# H2 - Desenvolvimento local
spring.datasource.url=jdbc:h2:file:./data/magicfridge;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=gugag
spring.datasource.password=${H2_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# WebClient
gemini.base-url=https://generativelanguage.googleapis.com
